# MMO303 final balance pass: release candidate roster.
# Source of truth is final-balance-pass-brief.md. If this file disagrees with
# the brief, the brief wins; report the difference.

rules:
  action_interval_s: 1.5        # every class acts at t = 0, 1.5, 3.0, ...
  crit_multiplier: 2.0
  mitigation_K: 100             # armor and MR both use 100 / (100 + value)

classes:
  Duelist:
    base_hit: 100
    crit_chance: 0.25
    special: none
    hp: 1200
    armor: 60
    mr: 20
    damage_type: physical
    range: melee

  Marksman:
    base_hit: 110
    crit_chance: 0.10
    special: none
    hp: 1000
    armor: 30
    mr: 30
    damage_type: physical
    range: ranged

  Berserker:
    base_hit: 95
    crit_chance: 0.15
    special: frenzy
    frenzy:
      proc_chance: 0.20         # rolled after each hit's crit roll, if the cooldown is ready
      damage_bonus: 0.30        # actions starting less than duration_s after the trigger
      duration_s: 6.0           # covers the next three actions; the triggering hit does not benefit
      internal_cooldown_s: 10.0 # measured from the trigger
    hp: 1400
    armor: 70
    mr: 10
    damage_type: physical
    range: melee

  Ritualist:
    base_hit: 70
    crit_chance: 0.20
    special: rite
    rite:
      charges_needed: 4         # each Hit grants 1; at 4 at the start of an action, cast Rite
      base_damage: 300          # can crit; consumes all charges; grants none
    hp: 900
    armor: 20
    mr: 60
    damage_type: magic
    range: ranged

fight_styles:
  S60:  {length_s: 60,  targets: 1, movement: false}
  S300: {length_s: 300, targets: 1, movement: false}
  M300: {length_s: 300, targets: 1, movement: true, melee_action_loss_chance: 0.15}
  Duel:
    start: full_health
    simultaneous_actions: true
    physical_multiplier: "100 / (100 + armor)"
    magic_multiplier: "100 / (100 + mr)"
    double_death: draw_half_win
    movement: false
    healing: false
