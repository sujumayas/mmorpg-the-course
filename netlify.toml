# Netlify builds the curriculum website from the Markdown sources on every push.
# The build needs Python and the packages in requirements.txt (installed automatically).
[build]
  command = "python3 -m pip install -q -r requirements.txt && python3 tools/build_site.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
