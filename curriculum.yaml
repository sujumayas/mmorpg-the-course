- code: MA102
  title: "Mathematics for Games II: Probability and Statistics"
  year: 1
  semester: 2
  track: core
  credits: 4
  prereqs: [MA101]
  description: "Loot, crits, drop rates, matchmaking and A/B tests all run on probability. This course makes randomness designable."
  outcomes:
    - "Compute probabilities of compound events (drops, crits, combos)"
    - "Use expected value and variance to compare designs"
    - "Model 'until success' processes with the geometric distribution"
    - "Design pseudo-random and pity systems with controlled variance"
    - "Read basic statistics from playtest data"
  weeks:
    - "Probability basics: sample spaces and events"
    - "Independent events: the gambler's fallacy in loot"
    - "Complement rule: chance of at least one drop"
    - "Expected value: comparing weapons"
    - "Variance and standard deviation: 'swingy' designs"
    - "Binomial distribution: crits over a fight"
    - "Geometric distribution: kills until the drop"
    - "Dice sums and the normal curve (2d6 vs 1d12)"
    - "Weighted tables and loot table design"
    - "Pseudo-random distribution and pity timers"
    - "Monte Carlo simulation"
    - "Descriptive statistics for playtests"
    - "Sampling, confidence and why n=5 lies"
    - "Intro to hypothesis testing (A/B)"
    - "Final exam + loot system design"
  worked_examples:
    - "1% drop rate: after 100 kills only ~63% of players have it — and 1 in 20 still lacks it after ~300 kills"
    - "Dota 2 pseudo-random distribution: same average crit rate, far lower streakiness (verify C constants)"
    - "Gacha pity: soft/hard pity changes the expected pulls (Genshin hard pity at 90; verify soft-pity rates)"
    - "2d6 vs 1d12: same range, completely different feel"
  readings:
    - "Schreiber — Game Balance Concepts (blog course), levels 4-5"
    - "Schreiber & Romero — Game Balance (2021), ch. on probability"
  assessment: "Problem sets (35%), Monte Carlo lab (20%), loot design (20%), final (25%)"

