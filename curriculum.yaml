# Source of truth for the whole program. PLAN.md is generated from this file.
# Every course: 15-week semester. Weeks 1-14 are content; week 15 is final review / showcase.
# worked_examples: the "signature" candlesan-style examples each course MUST ship
# (real shipped game -> formula/model -> numbers -> interactive visual -> cross-game -> design judgment).
# Items marked (verify) must be checked against a primary source before publishing.

program:
  name: "BSc Game Development — MMORPG Specialization"
  years: 4
  semesters: 8
  weeks_per_semester: 15
  structure:
    - "Years 1-2: Core (every student) — design, programming, math, art/audio, production"
    - "Years 3-4: MMORPG specialization — worlds, servers, balance, economies, society, live ops"
  reference_stack:
    math_and_sims: "Python 3 + Jupyter (numpy, matplotlib) and single-file HTML/JS interactives"
    client: "Godot 4 (C# or GDScript); concepts portable to Unity/Unreal"
    engine_course: "C++20"
    server: "C# (.NET 8) reference implementation; Go accepted"
    data: "PostgreSQL + Redis"

courses:

# ============================== YEAR 1 · SEMESTER 1 ==============================
- code: GD101
  title: "Introduction to Game Design"
  year: 1
  semester: 1
  track: core
  credits: 4
  prereqs: []
  description: "What a game is, how its parts produce experience, and how designers test ideas cheaply with paper before code."
  outcomes:
    - "Describe any game with formal elements (players, objectives, rules, resources, conflict, boundaries, outcome)"
    - "Analyze games with the MDA framework"
    - "Build and iterate a paper prototype using structured playtests"
    - "Write a one-page design and a playtest report"
  weeks:
    - "What is a game? Definitions (Suits, Salen & Zimmerman, Juul)"
    - "Formal elements: players, objectives, procedures, rules"
    - "Resources, conflict, boundaries, outcome"
    - "MDA: mechanics, dynamics, aesthetics"
    - "Player experience goals and the 8 kinds of fun"
    - "Paper prototyping I: cards, dice, boards"
    - "Playtesting method: observe, don't explain"
    - "Iteration loops and kill-your-darlings"
    - "Choice and meaningful decisions (Sid Meier's 'interesting decisions')"
    - "Chance vs skill; the role of randomness"
    - "Balance intuition: dominant strategies and how to spot them"
    - "Feedback: juice, clarity, readability"
    - "Genres as clusters of mechanics"
    - "Design documents: one-pagers and pitch"
    - "Final: paper game showcase and playtest report"
  worked_examples:
    - "Tic-tac-toe is solved: map the full game tree and show why it stops being fun"
    - "Monopoly's positive feedback loop: simulate wealth concentration over 50 turns"
    - "Dominant strategy hunt: a broken card game fixed with one rule change"
  readings:
    - "Fullerton — Game Design Workshop (4th ed.), ch. 1-7"
    - "Hunicke, LeBlanc, Zubek (2004) — MDA: A Formal Approach to Game Design"
    - "Salen & Zimmerman — Rules of Play, ch. 7-9"
  assessment: "Paper prototype (40%), 3 playtest reports (30%), analysis essay (20%), participation (10%)"

- code: CS101
  title: "Programming for Games I"
  year: 1
  semester: 1
  track: core
  credits: 4
  prereqs: []
  description: "First programming course, taught entirely through small games: variables to game loops to a complete arcade game."
  outcomes:
    - "Write, run and debug programs using variables, conditionals, loops and functions"
    - "Explain and implement a fixed-timestep game loop"
    - "Handle input, draw sprites, detect collisions"
    - "Ship a complete small arcade game"
  weeks:
    - "Programs, variables, types — a text adventure's state"
    - "Conditionals — room transitions and win/lose"
    - "Loops — the game loop concept"
    - "Functions and decomposition"
    - "Arrays and lists — inventories"
    - "Dictionaries/maps — item databases"
    - "Engine intro: scenes, nodes, scripts (Godot)"
    - "Input handling and movement"
    - "Delta time and frame-rate independence"
    - "Collision basics: AABB and circles"
    - "Game state machines (menu, play, pause, game over)"
    - "Debugging: breakpoints, logging, rubber-ducking"
    - "Randomness: spawning and procedural variety"
    - "Polish pass: sound, particles, screen shake"
    - "Final: arcade game release"
  worked_examples:
    - "Why movement speed doubles on a 120 Hz monitor without delta time — side-by-side interactive"
    - "Fixed vs variable timestep: the 'Fix Your Timestep' accumulator visualized"
    - "AABB overlap test shown as four comparisons on a live drag-and-drop canvas"
  readings:
    - "Nystrom — Game Programming Patterns: Game Loop, Update Method"
    - "Fiedler — Fix Your Timestep! (gafferongames.com)"
  assessment: "Weekly exercises (40%), 2 mini-games (30%), final arcade game (30%)"

- code: MA101
  title: "Mathematics for Games I: Algebra, Functions & Trigonometry"
  year: 1
  semester: 1
  track: core
  credits: 4
  prereqs: []
  description: "The math that sits inside every stat sheet and every movement script: functions, curves, trig and vectors."
  outcomes:
    - "Model game quantities with linear, polynomial, exponential, logarithmic and rational functions"
    - "Choose a curve shape to produce a desired feel (growth, diminishing returns, caps)"
    - "Use trigonometry for rotation, aiming and circular motion"
    - "Use 2D vectors for movement, direction and distance"
  weeks:
    - "Functions as machines: input stat, output effect"
    - "Linear functions and rates (damage per level)"
    - "Polynomials and quadratic curves (jump arcs)"
    - "Exponentials: growth and the XP curve"
    - "Logarithms: 'how many levels until…'"
    - "Rational functions and asymptotes: A/(A+K)"
    - "Piecewise functions, caps and floors"
    - "Interpolation: lerp, inverse lerp, remap"
    - "Easing curves for animation feel"
    - "Angles, radians, sin/cos — orbiting and aiming"
    - "atan2 and turning toward a target"
    - "2D vectors: add, scale, magnitude, normalize"
    - "Dot product: facing, field of view cones"
    - "Distances and ranges: circles, squared distance trick"
    - "Final exam + curve-design mini project"
  worked_examples:
    - "Armor / (Armor + K): mitigation curve vs effective HP line (League of Legends K=100, WoW K=400+85·level) — the course's anchor example"
    - "RuneScape XP curve: why level 92 is halfway to 99 (verified: 6,517,253 of 13,034,431 XP)"
    - "Diagonal movement bug: why un-normalized WASD is ~41% faster"
    - "Dot product vision cone: stealth guard that 'sees' 60° ahead"
  readings:
    - "Dunn & Parberry — 3D Math Primer for Graphics and Game Development, ch. 1-2"
    - "Freya Holmér — Math for Game Devs lecture series (video)"
  assessment: "Problem sets (40%), curve-design project (20%), midterm (15%), final (25%)"

